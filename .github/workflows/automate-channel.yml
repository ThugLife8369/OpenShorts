name: Cloud Automated Short-Form Pipeline

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Podcast / Interview URL to Process'
        required: false
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
        type: string

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg natively
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Pipeline via Cloud Runner
        run: |
          # Use user-provided input if available, else fall back to default
          TARGET_URL="${{ github.event.inputs.youtube_url }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          fi
          
          python main.py -u "$TARGET_URL" --format auto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AUTO_CAPTIONS: '1'
          AUTO_HOOK: '1'

      - name: Upload Generated Short Clips Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-clips
          path: '*.mp4'
          if-no-files-found: warn
