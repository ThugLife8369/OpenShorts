name: Cloud Automated Short-Form Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily on GitHub's cloud servers
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Pipeline via Cloud Runner
        run: |
          if [ -f "main.py" ]; then
            python main.py --process-latest-niche-video
          elif [ -f "OpenShorts/main.py" ]; then
            python OpenShorts/main.py --process-latest-niche-video
          else
            python main.py --process-latest-niche-video
          fi
        working-directory: .
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: 'us-east-1' # Match this to your chosen AWS region if different
